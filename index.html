return `<div class="card" style="padding:12px 16px;margin-bottom:16px"><div class="row" style="gap:12px;flex-wrap:nowrap"><span class="mu" style="white-space:nowrap">👁 ${t('swt')}</span><select id="vas" style="margin:0"><option value="">${t('swm')}</option>${o.map(([k,x])=>`<option value="${esc(k)}" ${vas==k?'selected':''}>@${esc(k)} · ${x.role}</option>`).join('')}</select></div>${ro?`<p class="mu" style="margin-top:8px">${t('swn')}</p>`:''}</div>`}
function vview(){if(vas&&db.u[vas]&&db.u[vas].role=='user'&&['home','wallet','ref','me'].includes(page)){const r=me;me=vas;try{return `<div style="pointer-events:none">${view()}</div>`}finally{me=r}}return view()}

const n0=v=>+String(v??'').replace(',','.')||0,r2=v=>Math.round(v*100)/100,sg=v=>(v>0?'+':'')+r2(v),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
dt=s=>new Date(s+'T00:00:00Z'),ds=d=>d.toISOString().slice(0,10),
addD=(s,n)=>{const d=dt(s);d.setUTCDate(d.getUTCDate()+n);return ds(d)},wk=s=>addD(s,-((dt(s).getUTCDay()+6)%7)),
shM=k=>{const d=dt(fm+'-01');d.setUTCMonth(d.getUTCMonth()+k);return ds(d).slice(0,7)};
function fmap(){const m={};db.fr.forEach(r=>{const o=m[r.d]||(m[r.d]={net:0,rec:0,cost:0,add:0,sold:0});
if(r.kind=='tickets'){o.rec+=n0(r.received);o.cost+=n0(r.pay);o.add+=n0(r.added);o.sold+=n0(r.sold)}else if(r.kind=='bonus')o.cost+=n0(r.amount);o.net=o.rec-o.cost});return m}
function sumR(m,a,b){const o={net:0,rec:0,cost:0,add:0,sold:0};for(let s=a;s<=b;s=addD(s,1)){const x=m[s];if(x)for(const k in o)o[k]+=x[k]}return o}
const cl=v=>v<0?'neg':v>0?'pos':'';
async function fins(o){const{error}=await sb.from('fin_rows').insert(o);if(error)return toast(error.message);toast('✓');await load()}

function finPayTbl(){
const T={};db.fp.forEach(p=>T[p.id]={p,id:p.id,tk:0,bn:0,pd:0});
db.fr.forEach(r=>{const o=T[r.person_id];if(!o)return;if(r.kind=='tickets')o.tk+=n0(r.pay);else if(r.kind=='bonus')o.bn+=n0(r.amount);else if(r.kind=='payout')o.pd+=n0(r.amount)});
const refN=n=>friends(n).reduce((a,[k,x])=>a+Math.max(0,fb(x)-(x.paid||0)),0)+Math.max(0,prem(n).amt-((db.u[n]||{}).premPaid||0));
const nk=new Set(db.fp.map(p=>p.nick).filter(Boolean));
const R=Object.values(T).map(o=>({...o,rf:o.p.nick?refN(o.p.nick):0}));
[...new Set(Object.values(db.u).map(x=>x.ref).filter(Boolean))].filter(n=>!nk.has(n)&&refN(n)>0).forEach(n=>R.push({p:{name:'@'+n},tk:0,bn:0,pd:0,rf:refN(n)}));
const due=o=>o.tk+o.bn-o.pd+o.rf;R.sort((a,b)=>due(b)-due(a));
const tot=R.reduce((a,o)=>a+Math.max(0,due(o)),0);
return `<div class="tw"><table><tr class="mu"><th></th><th>${t('ftk')}</th><th>${t('fbn')}</th><th>${t('frf')}</th><th>${t('fpd')}</th><th>${t('fdue')}</th><th></th></tr>${R.map(o=>{const own=o.tk+o.bn-o.pd;
return `<tr><td>${esc(o.p.name)}${o.p.nick?`<br><span class="mu">@${esc(o.p.nick)}</span>`:''}</td><td>${r2(o.tk)}</td><td>${r2(o.bn)}</td><td>${r2(o.rf)}</td><td class="mu">${r2(o.pd)}</td><td><b>${r2(due(o))} ₴</b></td><td style="text-align:right">${o.id&&own>0?`<button class="btn sm" data-fpay="${o.id}" data-fa="${r2(own)}">${t('fpb')}</button>`:''}</td></tr>`}).join('')||`<tr><td class="mu">${t('none')}</td></tr>`}
<tr><td><b>${t('ftot')}</b></td><td></td><td></td><td></td><td></td><td><b>${r2(tot)} ₴</b></td><td></td></tr></table></div><p class="mu" style="margin-top:10px">${t('fpn')}</p>`}
function finPayBox(){return db.fe?'':`<h2 style="margin-top:22px">${t('fpay2')}</h2>${finPayTbl()}`}

function finView(){
if(db.fe)return `<div class="card"><h2>${t('fin')}</h2><p style="color:var(--bad);font-weight:700;margin:8px 0">${esc(db.fe)}</p><p class="mu">${t('fsql')}</p></div>`;
const m=fmap(),td=day(),first=fm+'-01',last=addD(ds(new Date(Date.UTC(+fm.slice(0,4),+fm.slice(5,7),1))),-1),
mn=dt(first).toLocaleDateString(lg=='uk'?'uk':'ru',{month:'long',year:'numeric',timeZone:'UTC'}),
stat=(l,o)=>`<div class="card" style="flex:1;margin:0;min-width:160px"><span class="mu">${l}</span><div class="big ${cl(o.net)}" style="font-size:30px">${sg(o.net)} ₴</div><span class="mu">${t('frec')} ${r2(o.rec)} · ${t('fcost')} ${r2(o.cost)}</span></div>`;
let cal=t('dn').map(x=>`<div class="h">${x}</div>`).join('')+`<div class="h">Σ</div>`;
for(let s=wk(first);s<=last;s=addD(s,7)){for(let i=0;i<7;i++){const c=addD(s,i),o=m[c];
cal+=`<div class="cd ${c.slice(0,7)==fm?'':'o'} ${c==fd?'on':''} ${c==td?'td':''}" data-fd="${c}"><b>${+c.slice(8)}</b><span class="v ${o?cl(o.net):''}">${o?Math.round(o.net):''}</span></div>`}
const w=sumR(m,s,addD(s,6));cal+=`<div class="cd wk"><b>Σ</b><span class="v ${cl(w.net)}">${w.rec||w.cost?Math.round(w.net):''}</span></div>`}
const E=db.fr.filter(r=>r.d==fd),dd=sumR(m,fd,fd),pn=id=>esc((db.fp.find(p=>p.id==id)||{}).name||'?'),
opts=db.fp.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''),
det=r=>r.kind=='tickets'?`${t('fadd')} ${r.added} · ${t('fsold')} ${r.sold} · ${t('frec')} ${r2(n0(r.received))} · ${t('fpay')} ${r2(n0(r.pay))} → <b class="${cl(n0(r.received)-n0(r.pay))}">${sg(n0(r.received)-n0(r.pay))} ₴</b>`:
r.kind=='bonus'?`${t('fbon')} <b class="neg">−${r2(n0(r.amount))} ₴</b> ${esc(r.note)}`:`${t('fpout')} <b>${r2(n0(r.amount))} ₴</b>`;
const forms=db.fp.length?`<div class="ff"><div><span class="mu">${t('fppl')}</span><select id="ftp">${opts}</select></div><div><span class="mu">${t('fa1')}</span><input id="fta" type="number" inputmode="decimal"></div><div><span class="mu">${t('fa2')}</span><input id="fts" type="number" inputmode="decimal"></div><div><span class="mu">${t('fa3')}</span><input id="ftr" type="number" inputmode="decimal"></div><div><span class="mu">${t('fa4')}</span><input id="ftg" type="number" inputmode="decimal"></div></div><button class="btn" id="ftb">${t('fsave')}: ${t('fq')}</button>
<div class="ff" style="margin-top:22px"><div><span class="mu">${t('fppl')}</span><select id="fbp">${opts}</select></div><div><span class="mu">${t('fam')}</span><input id="fba" type="number" inputmode="decimal"></div><div style="grid-column:span 2"><span class="mu">${t('freason')}</span><input id="fbn"></div></div><button class="btn g" id="fbb">${t('fsave')}: ${t('fb')}</button>`:`<p class="mu">${t('fnop')}</p>`;
return `<div class="row" style="margin-bottom:22px;align-items:stretch">${stat(t('ftoday'),sumR(m,td,td))}${stat(t('fweek'),sumR(m,wk(td),addD(wk(td),6)))}${stat(mn,sumR(m,first,last))}</div>
<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px"><button class="btn g sm" data-fm="-1">‹</button><h2 style="margin:0;text-transform:capitalize">${mn}</h2><div class="row" style="gap:8px"><button class="btn g sm" data-fm="t">${t('ftoday')}</button><button class="btn g sm" data-fm="1">›</button></div></div><div class="cal">${cal}</div><p class="mu" style="margin-top:12px">${t('fnr')}</p></div>
<div class="card"><h2>${t('fday')}: ${fd}</h2><p class="mu" style="margin-bottom:12px">${t('fnet')}: <b class="${cl(dd.net)}">${sg(dd.net)} ₴</b> · ${t('fadd')} ${dd.add} · ${t('fsold')} ${dd.sold}</p>
<div class="tw"><table>${E.map(r=>`<tr><td>${pn(r.person_id)}</td><td>${det(r)}</td><td style="text-align:right"><button class="btn r sm" data-fdel="${r.id}">✕</button></td></tr>`).join('')||`<tr><td class="mu">${t('fnone')}</td></tr>`}</table></div><br>${forms}</div>
<div class="card"><h2>${t('fpay2')}</h2>${finPayTbl()}</div>
<div class="card"><h2>${t('fppl')}</h2><div class="tw"><table>${db.fp.map(p=>`<tr><td>${esc(p.name)}</td><td class="mu">${p.nick?'@'+esc(p.nick):''}</td><td style="text-align:right"><button class="btn r sm" data-fpdel="${p.id}">✕</button></td></tr>`).join('')}</table></div><br>
<div class="ff"><div><input id="fpn" placeholder="${t('fname')}"></div><div><input id="fpk" placeholder="${t('fnick')}"></div></div><button class="btn" id="fpb">${t('fsave')}</button></div>`}

function fbind(){const q=s=>document.querySelectorAll(s),g=s=>($(s)||{}).value||'',fail=e=>e&&toast(e.message);
if($('#vas'))$('#vas').onchange=async()=>{vas=$('#vas').value||null;page=null;await load()};
q('[data-fd]').forEach(e=>e.onclick=()=>{fd=e.dataset.fd;fm=fd.slice(0,7);render()});
q('[data-fm]').forEach(e=>e.onclick=()=>{if(e.dataset.fm=='t'){fd=day();fm=fd.slice(0,7)}else fm=shM(+e.dataset.fm);render()});
if($('#ftb'))$('#ftb').onclick=()=>fins({d:fd,kind:'tickets',person_id:+g('#ftp'),added:n0(g('#fta')),sold:n0(g('#fts')),received:n0(g('#ftr')),pay:n0(g('#ftg'))});
if($('#fbb'))$('#fbb').onclick=()=>{const a=n0(g('#fba'));if(!a)return;fins({d:fd,kind:'bonus',person_id:+g('#fbp'),amount:a,note:g('#fbn').trim().slice(0,200)})};
if($('#fpb'))$('#fpb').onclick=async()=>{const name=g('#fpn').trim();if(!name)return;const{error}=await sb.from('fin_people').insert({name:name.slice(0,60),nick:nm(g('#fpk'))||null});if(error)return fail(error);await load()};
q('[data-fdel]').forEach(e=>e.onclick=async()=>{const{error}=await sb.from('fin_rows').delete().eq('id',+e.dataset.fdel);if(error)return fail(error);await load()});
q('[data-fpdel]').forEach(e=>e.onclick=async()=>{if(!confirm(t('fconf')))return;const{error}=await sb.from('fin_people').delete().eq('id',+e.dataset.fpdel);if(error)return fail(error);await load()});
q('[data-fpay]').forEach(e=>e.onclick=()=>{const a=n0(prompt(t('fpa'),e.dataset.fa));if(a>0)fins({d:day(),kind:'payout',person_id:+e.dataset.fpay,amount:a})})}

load();
</script></body></html>
